<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cow Counter</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: #6b7280; margin-top: 0; }
    form {
      border: 1px dashed #9ca3af;
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }
    button {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #15803d; }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
    }
    .result {
      border-radius: 12px;
      padding: 1.25rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    .count {
      font-size: 2rem;
      font-weight: 700;
      color: #166534;
      margin: 0 0 0.75rem;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>🐄 Cow Counter</h1>
  <p class="subtitle">Upload a photo and we'll detect and count the cows in it.</p>

  <form method="post" enctype="multipart/form-data">
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit">Count cows</button>
  </form>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  {% if result %}
    <div class="result">
      <p class="count">{{ result.count }} cow{{ 's' if result.count != 1 else '' }} detected</p>
      {% if result.image %}
        <img src="data:image/jpeg;base64,{{ result.image }}" alt="Annotated photo with detected cows highlighted">
      {% endif %}
    </div>
  {% endif %}
</body>
</html>
